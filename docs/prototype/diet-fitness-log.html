function StatsTab({ state, setState, toast, viewDate }) {
  const [days, setDays] = useState(30);
  const [exRange, setExRange] = useState('30');
  const [prompt, setPrompt] = useState(C.DEFAULT_PROMPT);
  const [addOpen, setAddOpen] = useState(false);
  const [reportText, setReportText] = useState('');

  const to = C.todayKey();
  const from = C.addDays(to, -(days - 1));

  // 导出区间独立于统计区间
  const [exFrom, exTo] = useMemo(() => {
    if (exRange === 'day') return [viewDate, viewDate];
    if (exRange === 'all') {
      const keys = Object.keys(state.days)
        .filter(k => !C.dayIsEmpty(C.getDay(state, k))).sort();
      return [keys[0] || to, to];
    }
    return [C.addDays(to, -(+exRange - 1)), to];
  }, [exRange, viewDate, state.days, to]);
  const exOneDay = exFrom === exTo;

  // 切到单日/多日时换用对应的默认提示词，但只在用户没改过的时候换，不能覆盖手写内容
  useEffect(() => {
    const want = exOneDay ? C.DAY_PROMPT : C.DEFAULT_PROMPT;
    setPrompt(p => (p === C.DAY_PROMPT || p === C.DEFAULT_PROMPT) ? want : p);
  }, [exOneDay]);

  const series = useMemo(() => {
    const out = [];
    for (let i = days - 1; i >= 0; i--) {
      const key = C.addDays(to, -i);
      const day = C.getDay(state, key);
      const t = C.dayTotals(day);
      const tg = C.targetForDate(state.targets, key);
      out.push({
        key, kcal: t.kcal, p: t.p, volume: t.volume,
        target: tg ? tg.kcal : 0,
        empty: C.dayIsEmpty(day),
        hit: tg && tg.kcal ? Math.abs(t.kcal - tg.kcal) <= tg.kcal * 0.1 : false
      });
    }
    return out;
  }, [state, days, to]);

  const withData = series.filter(d => !d.empty);
  const avgKcal = withData.length ? Math.round(withData.reduce((a, b) => a + b.kcal, 0) / withData.length) : 0;
  const avgP = withData.length ? C.round(withData.reduce((a, b) => a + b.p, 0) / withData.length, 1) : 0;
  const hits = withData.filter(d => d.hit).length;
  const volume = series.reduce((a, b) => a + b.volume, 0);
  const maxKcal = Math.max(1, ...series.map(d => Math.max(d.kcal, d.target)));

  const payload = useMemo(() => C.exportPayload(state, exFrom, exTo, null), [state, exFrom, exTo]);
  const sizeKb = useMemo(() => Math.round(JSON.stringify(payload).length / 1024), [payload]);
  const buildJson = useCallback(() => JSON.stringify({ ...payload, analysisPrompt: prompt }, null, 2), [payload, prompt]);

  return (
    <>
      <div className="hd">
        <div>
          <div className="hd-eyebrow">近 {days} 天</div>
          <h1 className="hd-title">统计</h1>
        </div>
      </div>
      <div className="scroll">
        <Seg value={String(days)} onChange={v => setDays(+v)} options={[
          { id: '7', label: '7 天' }, { id: '30', label: '30 天' }, { id: '90', label: '90 天' }]} />

        <div className="grid2" style={{ marginTop: 14 }}>
          <div className="stat"><div className="stat-l">平均热量</div><div className="stat-v">{avgKcal}</div></div>
          <div className="stat"><div className="stat-l">平均蛋白 g</div><div className="stat-v">{avgP}</div></div>
          <div className="stat"><div className="stat-l">热量达标天</div><div className="stat-v">{hits}<span style={{ fontSize: 13, color: 'var(--text-2)' }}> / {withData.length}</span></div></div>
          <div className="stat"><div className="stat-l">训练总容量 kg</div><div className="stat-v">{volume}</div></div>
        </div>

        <div className="sec">
          <div className="sec-hd"><span className="sec-t">每日热量（实心为达标）</span></div>
          <div className="card" style={{ padding: '14px 13px' }}>
            {withData.length === 0 ? <Empty>这段时间还没有记录。</Empty> : (
              <>
                <div className="spark">
                  {(() => {
                    const tg = series.filter(d => d.target > 0);
                    if (!tg.length) return null;
                    const avgT = tg.reduce((a, b) => a + b.target, 0) / tg.length;
                    return <div className="spark-goal" style={{ bottom: (avgT / maxKcal * 100) + '%' }} />;
                  })()}
                  {series.map(d => (
                    <i key={d.key} className={d.hit ? 'hit' : ''}
                      style={{ height: (d.kcal / maxKcal * 100) + '%' }}
                      title={`${shortDate(d.key)} · ${d.kcal} kcal`} />
                  ))}
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--text-2)', marginTop: 6, fontFamily: 'var(--mono)' }}>
                  <span>{shortDate(series[0].key)}</span>
                  <span>虚线为目标</span>
                  <span>{shortDate(series[series.length - 1].key)}</span>
                </div>
              </>
            )}
          </div>
        </div>

        <div className="sec">
          <div className="sec-hd"><span className="sec-t">导出给 AI 分析</span></div>
          <div className="card" style={{ padding: '13px 14px' }}>
            <div style={{ marginBottom: 14 }}>
              <Seg value={exRange} onChange={setExRange} options={[
                { id: 'day', label: '当天' }, { id: '7', label: '7 天' },
                { id: '30', label: '30 天' }, { id: 'all', label: '全部' }]} />
            </div>
            <Field label="分析提示词（会写进 JSON 的 analysisPrompt）">
              <textarea rows={5} value={prompt} onChange={e => setPrompt(e.target.value)} />
            </Field>
            <div className="rs" style={{ marginBottom: 12 }}>
              {exOneDay ? `${exFrom}（${dayTitle(exFrom)}）` : `${exFrom} ~ ${exTo}`}
              {' · '}有数据 {payload.range.daysWithData} 天 · 约 {sizeKb} KB
            </div>
            {payload.range.daysWithData === 0 && (
              <div className="rs" style={{ marginBottom: 12, color: 'var(--warn)' }}>
                这个范围里没有记录，导出的会是一份空数据。
              </div>
            )}
            <div style={{ display: 'flex', gap: 10 }}>
              <button className="btn ghost" style={{ flex: 1 }}
                onClick={() => downloadFile(
                  exOneDay ? `dietlog-${exFrom}.json` : `dietlog-${exFrom}_${exTo}.json`, buildJson())}>
                <Icon n="download" s={16} />下载
              </button>
              <button className="btn" style={{ flex: 1, height: 44, fontSize: 14 }}
                onClick={async () => toast(await copyText(buildJson()) ? '已复制 JSON' : '复制失败，请用下载')}>
                <Icon n="copy" s={16} />复制 JSON
              </button>
            </div>
          </div>
        </div>

        <div className="sec">
          <div className="sec-hd">
            <span className="sec-t">AI 分析存档</span>
            <button className="linkbtn" onClick={() => { setReportText(''); setAddOpen(true); }}>添加</button>
          </div>
          <div className="card">
            {state.aiReports.length === 0 ? (
              <Empty>把 AI 的回复贴回来存档，<br />以后能对照当时的数据回看。</Empty>
            ) : state.aiReports.slice().reverse().map((r, i) => (
              <React.Fragment key={r.id}>
                {i > 0 && <div className="rowdiv" />}
                <div className="row" style={{ alignItems: 'flex-start', paddingTop: 13, paddingBottom: 13 }}>
                  <div className="tile"><Icon n="sparkles" s={16} /></div>
                  <div className="grow">
                    <div className="rt">{r.range.from === r.range.to ? r.range.from : `${r.range.from} ~ ${r.range.to}`}</div>
                    <div className="rs" style={{ marginTop: 4, lineHeight: 1.6, whiteSpace: 'pre-wrap' }}>{r.responseText}</div>
                    <div className="rs" style={{ marginTop: 6, opacity: .7 }}>
                      {new Date(r.createdAt).toLocaleDateString()} · {r.source === 'api' ? 'API' : '手动粘贴'} · 含数据快照
                    </div>
                  </div>
                  <button className="iconbtn pale" style={{ width: 32, height: 32, marginRight: -6 }} aria-label="删除存档"
                    onClick={() => setState(s => ({ ...s, aiReports: s.aiReports.filter(x => x.id !== r.id) }))}>
                    <span style={{ width: 26, height: 26, background: 'transparent' }}><Icon n="trash" s={15} /></span>
                  </button>
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
      </div>

      {addOpen && (
        <Sheet title="存档 AI 分析" onClose={() => setAddOpen(false)}>
          <div className="rs" style={{ marginBottom: 14, lineHeight: 1.7 }}>
            会连同当前导出范围（{exOneDay ? exFrom : `${exFrom} ~ ${exTo}`}）的数据快照一起存下来，以后回看时能知道结论是基于什么数据得出的。
          </div>
          <Field label="AI 的回复">
            <textarea rows={10} value={reportText} onChange={e => setReportText(e.target.value)} placeholder="粘贴到这里" />
          </Field>
          <button className="btn" disabled={!reportText.trim()} onClick={() => {
            setState(s => ({
              ...s, aiReports: s.aiReports.concat([{
                id: C.uid(), createdAt: new Date().toISOString(),
                range: { from: exFrom, to: exTo }, requestPayload: { ...payload, analysisPrompt: prompt }, promptUsed: prompt,
                responseText: reportText.trim(), source: 'manual'
              }])
            }));
            setAddOpen(false); toast('已存档');
          }}>保存</button>
        </Sheet>
      )}
    </>
  );
}

/* ============ 设置 ============ */
function SettingsTab({ state, setState, toast }) {
  const fileRef = useRef(null);
  const [lib, setLib] = useState(null);
  const hiddenCount = (state.hiddenExerciseIds || []).length;
  const p = state.profile;
  const cur = C.targetForDate(state.targets, C.todayKey()) || { kcal: 0, proteinG: 0, fatG: 0, carbG: 0 };
  const [t, setT] = useState({
    kcal: String(cur.kcal), proteinG: String(cur.proteinG),
    fatG: String(cur.fatG), carbG: String(cur.carbG)
  });
  const est = C.tdee(p);
  const dirty = +t.kcal !== cur.kcal || +t.proteinG !== cur.proteinG || +t.fatG !== cur.fatG || +t.carbG !== cur.carbG;

  function setProfile(patch) { setState(s => ({ ...s, profile: { ...s.profile, ...patch } })); }
  function setSetting(patch) { setState(s => ({ ...s, settings: { ...s.settings, ...patch } })); }

  function saveTargets() {
    const today = C.todayKey();
    const next = { effectiveFrom: today, kcal: C.num(t.kcal), proteinG: C.num(t.proteinG), fatG: C.num(t.fatG), carbG: C.num(t.carbG) };
    setState(s => {
      const list = s.targets.filter(x => x.effectiveFrom !== today).concat([next]);
      list.sort((a, b) => a.effectiveFrom < b.effectiveFrom ? -1 : 1);
      return { ...s, targets: list };
    });
    toast('目标已更新，历史日期不受影响');
  }

  function applySuggestion() {
    const sug = C.suggestTargets(p);
    setT({ kcal: String(sug.kcal), proteinG: String(sug.proteinG), fatG: String(sug.fatG), carbG: String(sug.carbG) });
  }

  function importFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const raw = JSON.parse(String(r.result));
        // 既支持完整备份，也支持导出给 AI 的分析包（后者只含 days，不覆盖设置）
        if (raw.days && Array.isArray(raw.days)) {
          const map = {};
          raw.days.forEach(d => { map[d.date] = { meals: [], strength: [], cardio: [], note: d.note || '' }; });
          setState(s => ({ ...s, days: { ...s.days, ...map } }));
          toast('分析包只含汇总，仅恢复了日期与备注');
        } else {
          setState(C.migrate(raw));
          toast('已导入');
        }
      } catch (err) { toast('文件解析失败'); }
    };
    r.readAsText(file);
    e.target.value = '';
  }

  return (
    <>
      <div className="hd"><div><div className="hd-eyebrow">本地存储，数据不出设备</div><h1 className="hd-title">设置</h1></div></div>
      <div className="scroll">
        <div className="sec" style={{ marginTop: 0 }}>
          <div className="sec-hd"><span className="sec-t">个人档案</span></div>
          <div className="card" style={{ padding: '14px 14px 2px' }}>
            <Field label="性别（用于基础代谢公式）">
              <Seg value={p.sex} onChange={v => setProfile({ sex: v })}
                options={[{ id: 'male', label: '男' }, { id: 'female', label: '女' }]} />
            </Field>
            <div className="grid2">
              <Field label="出生年"><NumInput value={p.birthYear} onChange={v => setProfile({ birthYear: C.num(v) })} /></Field>
              <Field label="身高 cm"><NumInput value={p.heightCm} onChange={v => setProfile({ heightCm: C.num(v) })} /></Field>
            </div>
            <Field label="体重 kg">
              <NumInput value={p.weightKg} onChange={v => setProfile({ weightKg: C.num(v) })} />
              <div className="rs" style={{ marginTop: 7, lineHeight: 1.6 }}>
                只用于算基础代谢，不做每日记录。体重变化明显时手动改一次即可。
              </div>
            </Field>
            <Field label="活动强度">
              <select value={p.activityLevel} onChange={e => setProfile({ activityLevel: e.target.value })}>
                {C.ACTIVITY_LEVELS.map(a => <option key={a.id} value={a.id}>{a.label} ×{a.factor}</option>)}
              </select>
            </Field>
          </div>
        </div>

        <div className="sec">
          <div className="sec-hd">
            <span className="sec-t">每日目标</span>
            <button className="linkbtn" onClick={applySuggestion}>套用推荐值</button>
          </div>
          <div className="card" style={{ padding: '14px 14px 2px' }}>
            <div className="rs" style={{ marginBottom: 12, lineHeight: 1.7 }}>
              估算 TDEE <b style={{ fontFamily: 'var(--mono)' }}>{est}</b> kcal（Mifflin-St Jeor × 活动系数）。
              推荐值按蛋白 1.6 g/kg、脂肪占 25% 热量、碳水补足计算，可任意覆盖。
            </div>
            <div className="grid2">
              <Field label="热量 kcal"><NumInput value={t.kcal} onChange={v => setT({ ...t, kcal: v })} /></Field>
              <Field label="蛋白质 g"><NumInput value={t.proteinG} onChange={v => setT({ ...t, proteinG: v })} /></Field>
            </div>
            <div className="grid2">
              <Field label="脂肪 g"><NumInput value={t.fatG} onChange={v => setT({ ...t, fatG: v })} /></Field>
              <Field label="碳水 g"><NumInput value={t.carbG} onChange={v => setT({ ...t, carbG: v })} /></Field>
            </div>
            <div style={{ paddingBottom: 12 }}>
              <button className="btn sm" disabled={!dirty} onClick={saveTargets}>
                {dirty ? '保存为今天起生效' : '目标已是最新'}
              </button>
            </div>
          </div>
        </div>

        <div className="sec">
          <div className="sec-hd"><span className="sec-t">偏好</span></div>
          <div className="card">
            <div className="row">
              <div className="tile pale"><Icon n="flame" s={16} /></div>
              <div className="grow">
                <div className="rt">训练消耗回补额度</div>
                <div className="rs">活动系数已含日常活动，开启会双重计算</div>
              </div>
              <Switch on={!!state.settings.addBurnedToBudget} label="训练消耗回补额度"
                onChange={v => setSetting({ addBurnedToBudget: v })} />
            </div>
            <div className="rowdiv" />
            <div className="row" style={{ flexWrap: 'wrap', paddingTop: 12, paddingBottom: 12 }}>
              <div className="tile pale"><Icon n="monitor" s={16} /></div>
              <div className="grow"><div className="rt">主题</div></div>
              <div style={{ width: '100%', marginTop: 10 }}>
                <Seg value={state.settings.theme} onChange={v => setSetting({ theme: v })} options={[
                  { id: 'auto', label: '跟随系统' }, { id: 'light', label: '浅色' }, { id: 'dark', label: '深色' }]} />
              </div>
            </div>
          </div>
        </div>

        <div className="sec">
          <div className="sec-hd"><span className="sec-t">资料库</span></div>
          <div className="card">
            <button className="row" style={{ width: '100%', border: 0, background: 'none', cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left' }}
              onClick={() => setLib('food')}>
              <div className="tile"><Icon n="utensils" s={16} /></div>
              <div className="grow">
                <div className="rt">常用食物</div>
                <div className="rs">记录过的会自动入库，可在这里改错值</div>
              </div>
              <span className="rv" style={{ color: 'var(--text-2)' }}>{state.foodPresets.length}</span>
              <Icon n="right" s={16} style={{ color: 'var(--text-2)', flex: '0 0 auto', marginLeft: 6 }} />
            </button>
            <div className="rowdiv" />
            <button className="row" style={{ width: '100%', border: 0, background: 'none', cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left' }}
              onClick={() => setLib('exercise')}>
              <div className="tile pale"><Icon n="dumbbell" s={16} /></div>
              <div className="grow">
                <div className="rt">动作库</div>
                <div className="rs">{C.STRENGTH_DB.length + C.CARDIO_DB.length} 个内置 · 自定义 {state.customExercises.length} 个{hiddenCount ? ` · 已隐藏 ${hiddenCount}` : ''}</div>
              </div>
              <Icon n="right" s={16} style={{ color: 'var(--text-2)', flex: '0 0 auto', marginLeft: 6 }} />
            </button>
          </div>
        </div>

        <div className="sec">
          <div className="sec-hd"><span className="sec-t">数据</span></div>
          <div className="card" style={{ padding: 13 }}>
            <div className="rs" style={{ marginBottom: 12, lineHeight: 1.7 }}>
              数据只存在这台设备的浏览器里。清缓存会全部丢失，请定期导出备份。
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
              <button className="btn ghost" onClick={() =>
                downloadFile(`dietlog-backup-${C.todayKey()}.json`, JSON.stringify(state, null, 2))}>
                <Icon n="download" s={16} />导出完整备份
              </button>
              <button className="btn ghost" onClick={() => fileRef.current && fileRef.current.click()}>
                <Icon n="upload" s={16} />导入备份
              </button>
              <input ref={fileRef} type="file" accept="application/json,.json" onChange={importFile}
                style={{ display: 'none' }} />
              <button className="btn ghost danger" onClick={() => {
                if (confirm('清空全部数据？此操作不可撤销，建议先导出备份。')) { setState(C.defaultState()); toast('已清空'); }
              }}><Icon n="trash" s={16} />清空全部数据</button>
            </div>
          </div>
        </div>

        <div className="rs" style={{ textAlign: 'center', marginTop: 22, opacity: .7 }}>
          schema v{C.SCHEMA_VERSION} · 共 {Object.keys(state.days).length} 天记录
        </div>
      </div>

      {lib === 'food' && <FoodLibrary presets={state.foodPresets} onClose={() => setLib(null)}
        onChange={next => setState(s => ({ ...s, foodPresets: next }))} />}
      {lib === 'exercise' && <ExerciseLibrary state={state} setState={setState} onClose={() => setLib(null)} />}
    </>
  );
}

/* ============ 首次引导 ============ */
function Onboarding({ state, setState, onClose }) {
  const [p, setP] = useState(() => ({ ...state.profile }));
  const complete = C.profileComplete(p);
  const sug = complete ? C.suggestTargets(p) : null;

  return (
    <Sheet title="先设定一下" onClose={onClose}>
      <div className="rs" style={{ marginBottom: 18, lineHeight: 1.75 }}>
        算每日目标需要这几项。填完会给一组推荐值，之后随时能在设置里改。
      </div>
      <Field label="性别（基础代谢公式需要）">
        <Seg value={p.sex} onChange={v => setP({ ...p, sex: v })}
          options={[{ id: 'male', label: '男' }, { id: 'female', label: '女' }]} />
      </Field>
      <div className="grid2">
        <Field label="出生年"><NumInput value={p.birthYear} onChange={v => setP({ ...p, birthYear: v })} placeholder="1995" /></Field>
        <Field label="身高 cm"><NumInput value={p.heightCm} onChange={v => setP({ ...p, heightCm: v })} placeholder="172" /></Field>
      </div>
      <Field label="体重 kg">
        <NumInput value={p.weightKg} onChange={v => setP({ ...p, weightKg: v })} placeholder="68" />
        <div className="rs" style={{ marginTop: 7, lineHeight: 1.6 }}>只用于算基础代谢，不做每日记录。</div>
      </Field>
      <Field label="活动强度">
        <select value={p.activityLevel} onChange={e => setP({ ...p, activityLevel: e.target.value })}>
          {C.ACTIVITY_LEVELS.map(a => <option key={a.id} value={a.id}>{a.label} ×{a.factor}</option>)}
        </select>
      </Field>

      {complete ? (
        <div className="card" style={{ padding: '13px 14px', marginBottom: 16, fontSize: 13, lineHeight: 1.9 }}>
          <div>估算 TDEE <b style={{ fontFamily: 'var(--mono)' }}>{C.tdee(p)}</b> kcal</div>
          <div style={{ color: 'var(--text-2)', fontFamily: 'var(--mono)' }}>
            推荐 {sug.kcal} kcal · P {sug.proteinG} · F {sug.fatG} · C {sug.carbG}
          </div>
        </div>
      ) : (
        <div className="rs" style={{ marginBottom: 16 }}>把出生年、身高、体重填完就能算出推荐值。</div>
      )}

      <button className="btn" disabled={!complete} onClick={() => {
        const profile = {
          sex: p.sex, birthYear: C.num(p.birthYear), heightCm: C.num(p.heightCm),
          weightKg: C.num(p.weightKg), activityLevel: p.activityLevel
        };
        const t = C.suggestTargets(profile);
        setState(s => ({
          ...s, profile,
          settings: { ...s.settings, onboarded: true },
          targets: [{ effectiveFrom: '2000-01-01', kcal: t.kcal, proteinG: t.proteinG, fatG: t.fatG, carbG: t.carbG }]
        }));
        onClose();
      }}>开始使用</button>
    </Sheet>
  );
}

/* ============ App ============ */
const TABS = [
  { id: 'today', label: '今日', icon: 'pencil' },
  { id: 'history', label: '历史', icon: 'calendar' },
  { id: 'stats', label: '统计', icon: 'chart' },
  { id: 'settings', label: '设置', icon: 'settings' }
];

function App() {
  const [state, setState] = useState(() => C.load());
  const [tab, setTab] = useState('today');
  const [viewDate, setViewDate] = useState(() => C.todayKey());
  const [setupOpen, setSetupOpen] = useState(false);
  const needSetup = !state.settings.onboarded;
  const [toastMsg, setToastMsg] = useState(null);
  const timer = useRef(null);

  const toast = useCallback((m, undo) => {
    setToastMsg({ text: m, undo });
    if (timer.current) clearTimeout(timer.current);
    // 带撤销的多留几秒，够看清再决定
    timer.current = setTimeout(() => setToastMsg(null), undo ? 6000 : 2200);
  }, []);

  useEffect(() => { C.save(state); }, [state]);

  // 应用长时间挂着跨过午夜时，视图仍停在昨天且右箭头是禁用的，回到前台时校正
  useEffect(() => {
    const check = () => {
      if (document.visibilityState !== 'visible') return;
      const t = C.todayKey();
      setViewDate(d => (d > t ? t : d));
    };
    document.addEventListener('visibilitychange', check);
    return () => document.removeEventListener('visibilitychange', check);
  }, []);

  // 桌面端方向键切日期；有弹层打开或正在输入时不抢按键
  useEffect(() => {
    const h = (e) => {
      if (tab !== 'today' || sheetStack.length) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const el = document.activeElement;
      if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); setViewDate(d => C.addDays(d, -1)); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); setViewDate(d => (d < C.todayKey() ? C.addDays(d, 1) : d)); }
    };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [tab]);

  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const apply = () => {
      const th = state.settings.theme;
      const dark = th === 'dark' || (th === 'auto' && mq.matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    };
    apply();
    if (state.settings.theme === 'auto') {
      mq.addEventListener('change', apply);
      return () => mq.removeEventListener('change', apply);
    }
  }, [state.settings.theme]);

  return (
    <div className="app">
      {tab === 'today' && <TodayTab state={state} setState={setState} toast={toast}
        viewDate={viewDate} setViewDate={setViewDate} onSetup={() => setSetupOpen(true)} />}
      {tab === 'history' && <HistoryTab state={state} setState={setState}
        onJump={key => { setViewDate(key); setTab('today'); }} />}
      {tab === 'stats' && <StatsTab state={state} setState={setState} toast={toast} viewDate={viewDate} />}
      {tab === 'settings' && <SettingsTab state={state} setState={setState} toast={toast} />}

      <nav className="tabbar">
        {TABS.map(t => (
          <button key={t.id} aria-current={tab === t.id ? 'page' : undefined} onClick={() => setTab(t.id)}>
            <Icon n={t.icon} s={21} sw={tab === t.id ? 2 : 1.75} />
            <span>{t.label}</span>
          </button>
        ))}
      </nav>

      {(needSetup || setupOpen) && (
        <Onboarding state={state} setState={setState} onClose={() => setSetupOpen(false)} />
      )}

      {toastMsg && (
        <div className="toast" role="status">
          <span>{toastMsg.text}</span>
          {toastMsg.undo && <button onClick={() => { toastMsg.undo(); setToastMsg(null); }}>撤销</button>}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
